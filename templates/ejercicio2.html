<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="tarjeta">
    <h1>Inicio de sesión</h1>

    <form method="POST" action="/ejercicio2">
        <label for="usuario">Ingresa tu nombre</label>
        <input type="text" id="usuario" name="usuario" required>

        <label for="clave">Ingresa tu contraseña</label>
        <input type="password" id="clave" name="clave" required>

        <button type="submit" class="btn-azul">Verificar</button>
    </form>

    {% if mensaje %}
    <div class="resultado">
        <p>{{ mensaje }}</p>
    </div>
    {% endif %}


</div>
</body>
</html>
