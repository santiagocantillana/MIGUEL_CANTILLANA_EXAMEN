<<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="tarjeta">
    <h1>Cálculo de compras</h1>

    <form method="POST" action="/ejercicio1">
        <label for="nombre">Ingresa tu nombre</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="edad">Ingresa tu edad</label>
        <input type="number" id="edad" name="edad" min="0" required>

        <label for="tarros">Ingresa la cantidad de tarros de pintura a comprar</label>
        <input type="number" id="tarros" name="tarros" min="0" required>

        <button type="submit" class="btn-azul">Calcular</button>
    </form>

    {% if resultado %}
    <div class="resultado">
        <p>Nombre del cliente: {{ resultado.nombre }}</p>
        <p>Total sin descuento: ${{ resultado.total_sin_descuento }}</p>
        <p>El descuento es: ${{ resultado.descuento | int }}</p>
        <p>El total a pagar es de: ${{ resultado.total_a_pagar | int }}</p>
    </div>
    {% endif %}
</div>
</body>
</html>
